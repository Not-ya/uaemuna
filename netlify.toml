[build]
  command = "npm run build && npm test"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[[redirects]]
  from = "/register"
  to = "/registration/"
  status = 301
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg", "nodemailer", "web-push"]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/set-password/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
[[headers]]
  for = "/reset-password/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
